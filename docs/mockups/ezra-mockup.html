<title>Ezra's Caretaker App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fredoka:wght@500;600&family=Manrope:wght@500;600;700;800&family=Nunito:wght@500;600;700;800;900&display=swap">
<style>
:root{
  /* Layout: one phone-width app column. Sticky header, scrolling content, two-tab bar; every form rises as a bottom sheet. */
  --bg:#FBF6EE; --bg-outer:#EFE6D8; --surface:#FFFDF9; --surface-2:#F4ECE0;
  --ink:#2F2A25; --ink-2:#6B6157; --ink-3:#978C7F; --line:#EBE1D3; --line-strong:#DACDBA;
  --sage:#7FA37A; --sage-soft:#E3EDDE; --sage-ink:#3D5E39;
  --peach:#EE9F72; --peach-soft:#FCE6D8; --peach-ink:#8A4723;
  --sky:#7FADD2; --sky-soft:#DFECF6; --sky-ink:#2C5573;
  --lav:#A995CE; --lav-soft:#ECE6F6; --lav-ink:#54447C;
  --butter:#E2B84E; --butter-soft:#F9EFD1; --butter-ink:#74570E;
  --warn:#CC5A4E; --warn-soft:#FBE3DF; --warn-ink:#922F27;
  --primary:#4A7246; --on-primary:#FFFFFF; --primary-ink:#3D6739; --primary-deep:#35552F;
  --hero:#F9EFD1; --hero-ink:#2F2A25;
  --scrim:rgba(47,42,37,.4);
  --shadow:0 1px 2px rgba(90,64,30,.06),0 6px 18px rgba(90,64,30,.07);
  --frame-shadow:0 30px 80px rgba(90,64,30,.18);
  --font-display:"Fredoka",ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-lg:22px; --r-md:16px; --r-sm:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1C1916; --bg-outer:#110F0E; --surface:#26221F; --surface-2:#2F2A26;
    --ink:#F4EDE4; --ink-2:#BDB2A5; --ink-3:#8E8478; --line:#3A342E; --line-strong:#4B443C;
    --sage:#8DBB87; --sage-soft:#28362A; --sage-ink:#B9DDB3;
    --peach:#F0A980; --peach-soft:#41302A; --peach-ink:#F7C6A8;
    --sky:#86B6DC; --sky-soft:#22313E; --sky-ink:#B6D5EE;
    --lav:#B4A3DB; --lav-soft:#322B42; --lav-ink:#D6CBF0;
    --butter:#E6C25E; --butter-soft:#3B3220; --butter-ink:#F2D894;
    --warn:#E27468; --warn-soft:#432624; --warn-ink:#F5ACA3;
    --primary:#93C78C; --on-primary:#15230F; --primary-ink:#A9D8A2; --primary-deep:#5E8A58;
    --hero:#3B3220; --hero-ink:#F4EDE4;
    --scrim:rgba(0,0,0,.55);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    --frame-shadow:0 30px 80px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1C1916; --bg-outer:#110F0E; --surface:#26221F; --surface-2:#2F2A26;
  --ink:#F4EDE4; --ink-2:#BDB2A5; --ink-3:#8E8478; --line:#3A342E; --line-strong:#4B443C;
  --sage:#8DBB87; --sage-soft:#28362A; --sage-ink:#B9DDB3;
  --peach:#F0A980; --peach-soft:#41302A; --peach-ink:#F7C6A8;
  --sky:#86B6DC; --sky-soft:#22313E; --sky-ink:#B6D5EE;
  --lav:#B4A3DB; --lav-soft:#322B42; --lav-ink:#D6CBF0;
  --butter:#E6C25E; --butter-soft:#3B3220; --butter-ink:#F2D894;
  --warn:#E27468; --warn-soft:#432624; --warn-ink:#F5ACA3;
  --primary:#93C78C; --on-primary:#15230F; --primary-ink:#A9D8A2; --primary-deep:#5E8A58;
    --hero:#3B3220; --hero-ink:#F4EDE4;
  --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  --frame-shadow:0 30px 80px rgba(0,0,0,.5);
  color-scheme:dark;
}

html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Frame */
.stage{height:100%;display:flex;justify-content:center;align-items:center}
.app{position:relative;width:100%;height:100%;max-width:460px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:600px) and (min-height:640px){
  body{background:var(--bg-outer)}
  .stage{padding-block:24px}
  .app{height:min(900px,100%);border-radius:36px;box-shadow:var(--frame-shadow),0 0 0 1px var(--line)}
}
.mock-bar{flex:none;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px 10px;padding-block:6px;background:var(--surface-2);font-size:12px;font-weight:700;letter-spacing:.03em;color:var(--ink-2)}
.opt-switch{display:inline-flex;gap:2px;padding:2px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
.opt-switch button{min-width:38px;min-height:32px;padding:0 10px;border:none;border-radius:999px;background:none;font-family:var(--font-body);font-size:14px;font-weight:800;color:var(--ink-2)}
.opt-switch button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.opt-name{font-weight:600;color:var(--ink-3)}
.screen{flex:1;overflow-y:auto;overscroll-behavior:contain;min-height:0}

/* Header */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:14px 10px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.title{font-family:var(--font-display);font-weight:600;font-size:30px;line-height:1.1;margin:0;letter-spacing:-.005em;text-wrap:balance}
.avatar-btn{width:44px;height:44px;border-radius:50%;border:none;background:var(--butter-soft);color:var(--butter-ink);font-family:var(--font-display);font-weight:600;font-size:19px;flex:none}
.pillnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.pillnav-label{text-align:center;line-height:1.2;min-width:0}
.pillnav-label b{display:block;font-size:16px}
.pillnav-label span{font-size:13px;color:var(--ink-2)}
.icon-btn{width:42px;height:42px;border-radius:50%;border:none;background:transparent;color:var(--ink);display:grid;place-items:center;flex:none}
.icon-btn:hover:not(:disabled){background:var(--surface-2)}
.icon-btn:disabled{opacity:.28;cursor:default}
.icon-btn .ic{width:22px;height:22px}

.content{display:flex;flex-direction:column;gap:18px;padding-block:6px 28px}

/* Today */
.now{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:none;background:var(--sage-soft);color:var(--sage-ink);border-radius:var(--r-md);padding:12px 14px}
.now .dot{width:12px;height:12px;box-shadow:0 0 0 3px var(--surface)}
.now-txt{flex:1;min-width:0;font-size:16px;line-height:1.3}
.now-txt small{display:block;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;opacity:.85}
.progress{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:0;color:var(--ink-2);font-size:15px}
.progress b{color:var(--ink)}
.pips{display:flex;gap:4px}
.pips i{width:16px;height:6px;border-radius:999px;background:var(--line-strong)}
.pips i.on{background:var(--primary)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-height:142px;min-width:0;padding:14px;border-radius:var(--r-lg);border:1.5px solid transparent;background:var(--cs);text-align:left;color:var(--ink)}
.t-head{display:flex;align-items:center;gap:8px;color:var(--ci);font-weight:700;font-size:13px;letter-spacing:.07em;text-transform:uppercase}
.t-ico{width:30px;height:30px;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--ci)}
.t-ico .ic{width:18px;height:18px}
.t-big{font-family:var(--font-display);font-size:28px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.t-big small{font-size:16px;font-weight:500}
.t-food{font-weight:600;font-size:17px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.t-meta{font-size:14px;color:var(--ink-2)}
.t-by{margin-top:auto;font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.tile.empty{background:var(--surface);border:1.5px dashed var(--line-strong)}
.tile.empty .t-head{color:var(--ink-2)}
.tile.empty .t-ico{background:var(--cs)}
.t-add{margin-top:auto;display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:15px;color:var(--ci);background:var(--cs);padding:6px 12px 6px 9px;border-radius:999px}
.t-add .ic{width:16px;height:16px;stroke-width:2.5}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}

.section{display:flex;flex-direction:column;gap:10px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.h2{font-family:var(--font-display);font-size:21px;font-weight:600;margin:0}
.sub{margin:0;font-size:15px;color:var(--ink-2)}
.muted-sm{font-size:14px;color:var(--ink-3)}
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.list > li + li{border-top:1px solid var(--line)}
.note{display:grid;grid-template-columns:70px 1fr;gap:10px;width:100%;padding:12px 14px;border:0;background:none;text-align:left}
.note:hover{background:var(--surface-2)}
.n-time{font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums;padding-top:3px}
.n-body{display:flex;flex-direction:column;gap:4px;min-width:0}
.n-body p{margin:0;font-size:16px;line-height:1.35}
.kind{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--ks);color:var(--ki)}
.empty-line{margin:0;padding:14px;font-size:15px;color:var(--ink-3)}

/* Buttons */
.btn-primary,.btn-soft,.btn-dashed{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:999px;font-weight:700;font-size:16px}
.btn-primary{border:none;background:var(--primary);color:var(--on-primary)}
.btn-soft{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink)}
.btn-dashed{border:1.5px dashed var(--line-strong);background:transparent;color:var(--ink-2)}
.btn-dashed:hover,.btn-soft:hover{background:var(--surface-2)}
.wide{width:100%}
.btn-text{background:none;border:none;color:var(--primary-ink);font-weight:700;padding:10px 6px;font-size:15px}
.danger{color:var(--warn-ink)}
.btn-mini{min-height:34px;padding:0 14px;border-radius:999px;border:none;background:var(--surface);color:var(--warn-ink);font-size:14px;font-weight:700;flex:none}

/* Tab bar */
.tabbar{flex:none;display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border-top:1px solid var(--line);padding-block:6px 8px}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;border:none;background:none;font-size:13px;font-weight:700;color:var(--ink-3);padding:4px}
.tab-ico{width:60px;height:32px;border-radius:999px;display:grid;place-items:center}
.tab-ico .ic{width:22px;height:22px}
.tabbar button[aria-current="page"]{color:var(--primary-ink)}
.tabbar button[aria-current="page"] .tab-ico{background:var(--sage-soft)}

/* Segmented control */
.seg{display:grid;grid-template-columns:1fr 1fr;margin-top:12px;background:var(--surface-2);border-radius:999px;padding:4px}
.seg button{border:none;background:none;border-radius:999px;min-height:42px;font-weight:700;font-size:16px;color:var(--ink-2)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* Classes */
.places-bar{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);text-align:left}
.places-bar:hover{background:var(--surface-2)}
.dots-stack{display:flex;padding-left:4px}
.dots-stack i{width:16px;height:16px;border-radius:50%;border:2px solid var(--surface);margin-left:-5px}
.pb-text{flex:1;min-width:0;line-height:1.25}
.pb-text b{display:block;font-size:16px}
.pb-text small{font-size:13px;color:var(--ink-2)}
.link{color:var(--primary-ink);font-weight:700;font-size:15px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);font-size:15px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.age-badge{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;padding:5px 12px 5px 9px;border-radius:999px;background:var(--sage-soft);color:var(--sage-ink);font-size:14px;font-weight:700}
.age-badge .ic{width:16px;height:16px;stroke-width:2.5}
.group{display:flex;flex-direction:column;gap:8px}
.group-h{margin:0;font-size:13px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.class-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.class{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:12px 12px 12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md)}
.class.is-out{opacity:.7}
.c-time{line-height:1.05;font-variant-numeric:tabular-nums}
.c-time b{display:block;font-family:var(--font-display);font-size:20px;font-weight:600}
.c-time span{font-size:13px;color:var(--ink-2)}
.c-main{min-width:0;display:flex;flex-direction:column;gap:2px}
.c-main h4{margin:0;font-size:17px;font-weight:700;line-height:1.25}
.c-place{margin:0;display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ink-2)}
.c-meta{margin:0;font-size:13px;color:var(--ink-3)}
.c-meta .spots{color:var(--peach-ink);font-weight:700}
.c-meta .wait{color:var(--warn-ink);font-weight:700}
.c-meta .older{color:var(--warn-ink);font-weight:700}
.book{display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:0 12px 0 14px;border-radius:999px;border:none;background:var(--sage-soft);color:var(--sage-ink);font-weight:700;font-size:15px}
.book .ic{width:16px;height:16px;stroke-width:2.4}
.closed{margin:0;display:flex;align-items:center;gap:8px;padding:12px 14px;border-radius:var(--r-md);background:var(--peach-soft);color:var(--peach-ink);font-size:15px;font-weight:600}
.hidden-note{margin:0;font-size:15px;color:var(--ink-2);text-align:center}
.hidden-note .btn-text{padding:4px}
.idea{display:flex;align-items:center;gap:12px;padding:14px;border-radius:var(--r-md);border:1.5px dashed var(--line-strong)}
.idea-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.idea-main b{font-size:16px}
.idea-main span{font-size:14px;color:var(--ink-2)}
.price{font-size:12px;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:999px;background:var(--butter-soft);color:var(--butter-ink);align-self:flex-start}

/* Caretakers */
.cover-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.status{display:inline-flex;align-items:center;gap:6px;padding:5px 12px 5px 9px;border-radius:999px;font-size:14px;font-weight:700}
.status .ic{width:16px;height:16px;stroke-width:2.4}
.status.ok{background:var(--sage-soft);color:var(--sage-ink)}
.status.bad{background:var(--warn-soft);color:var(--warn-ink)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scale{position:relative;height:16px;margin-inline:15px;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.scale span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.scale span:first-child{transform:none}
.scale span:last-child{transform:translateX(-100%)}
.days{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.day{display:flex;flex-direction:column;gap:8px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md)}
.day.is-today{border-color:var(--sage);box-shadow:inset 0 0 0 1px var(--sage)}
.day.compact{flex-direction:row;align-items:center;justify-content:space-between;gap:10px;background:transparent;border-style:dashed;padding-block:10px}
.day-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.day-name{font-weight:700;font-size:16px}
.day-name span{font-weight:500;color:var(--ink-2)}
.tag{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--sage-soft);color:var(--sage-ink)}
.tag.holiday{background:var(--peach-soft);color:var(--peach-ink)}
.bar{position:relative;height:12px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;box-shadow:inset -2px 0 0 var(--surface)}
.bar i.gap{background:repeating-linear-gradient(135deg,var(--warn) 0 4px,var(--warn-soft) 4px 8px)}
.shifts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.shift{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:10px;width:calc(100% + 12px);margin-inline:-6px;padding:7px 6px;border:none;background:none;border-radius:10px;text-align:left}
.shift:hover{background:var(--surface-2)}
.who{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.when{font-size:15px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.hrs{font-size:13px;color:var(--ink-3);min-width:36px;text-align:right;font-variant-numeric:tabular-nums}
.gap-row{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 10px;border-radius:12px;background:var(--warn-soft);color:var(--warn-ink);font-size:15px;font-weight:600}
.gap-row > span{flex:1;min-width:0}
.hours{display:flex;flex-wrap:wrap;gap:8px}
.hour-chip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:15px}
.hour-chip b{font-variant-numeric:tabular-nums}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:28px 20px;border-radius:var(--r-lg);border:1.5px dashed var(--line-strong)}
.empty p{margin:0;color:var(--ink-2);font-size:15px;max-width:30ch}
.empty .empty-t{font-family:var(--font-display);font-size:20px;font-weight:600;color:var(--ink)}

/* Sheets */
.scrim{position:absolute;inset:0;z-index:20;background:var(--scrim)}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;max-height:90%;overflow-y:auto;background:var(--surface);border-radius:26px 26px 0 0;padding-block:8px 22px;box-shadow:0 -10px 40px rgba(0,0,0,.15)}
.sheet.in{animation:rise .28s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(48px);opacity:.3}to{transform:none;opacity:1}}
.grabber{width:40px;height:5px;border-radius:999px;background:var(--line-strong);margin:4px auto 10px}
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sheet-head h2{flex:1;margin:0;font-family:var(--font-display);font-size:23px;font-weight:600}
.sheet-ico{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--cs);color:var(--ci)}
.sheet-sub{margin:-6px 0 16px;color:var(--ink-2);font-size:15px}
.field{display:flex;flex-direction:column;gap:7px;margin:0 0 16px;border:0;padding:0;min-width:0}
.field > label,.field > legend,.label{font-size:14px;font-weight:700;color:var(--ink-2);padding:0}
.field > legend{margin-bottom:7px}
input[type="text"],input[type="email"],input[type="time"],textarea{width:100%;min-height:50px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line-strong);background:var(--bg);font-size:17px}
input[type="time"]{font-variant-numeric:tabular-nums}
textarea{min-height:80px;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--sage-soft)}
input[type="radio"],input[type="checkbox"]{accent-color:var(--primary)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row2 .field{margin-bottom:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt span{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line-strong);background:var(--surface);font-weight:600;font-size:15px;cursor:pointer}
.opt input:checked + span{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.opt input:focus-visible + span{outline:3px solid var(--sky);outline-offset:2px}
.food-chip{min-height:34px;padding:0 12px;border-radius:999px;border:1px dashed var(--line-strong);background:transparent;font-size:14px;font-weight:600;color:var(--ink-2)}
.calc{margin:0 0 16px;padding:10px 14px;border-radius:12px;background:var(--sky-soft);color:var(--sky-ink);font-weight:700;font-size:15px}
.sheet-actions{display:flex;align-items:center;gap:12px;margin-top:6px}
.sheet-actions .btn-primary{flex:1}
.err{margin:0;font-size:14px;font-weight:600;color:var(--warn-ink)}
.choice{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border:1.5px solid var(--line-strong);border-radius:14px;cursor:pointer}
.choice:has(input:checked){border-color:var(--primary);background:var(--sage-soft)}
.choice input{margin-top:4px;width:18px;height:18px;flex:none}
.choice b{display:block;font-size:16px}
.choice small{font-size:14px;color:var(--ink-2)}
.stack{display:flex;flex-direction:column;gap:8px}
.picklist{display:flex;flex-direction:column;gap:2px;padding:4px 0 0 30px}
.check{display:flex;align-items:center;gap:10px;font-size:16px;padding:6px 0;cursor:pointer}
.check input{width:20px;height:20px}
.inline{display:flex;gap:8px}
.inline input{flex:1;min-width:0}
.plist{list-style:none;margin:0 0 18px;padding:0;display:flex;flex-direction:column;gap:2px}
.plist li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.plist li > div{flex:1;min-width:0;line-height:1.3}
.plist b{display:block}
.plist small{font-size:14px;color:var(--ink-2)}
.ok-ico{color:var(--sage-ink)}
.people{list-style:none;margin:0 0 14px;padding:0}
.people li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.people li > div{line-height:1.3;min-width:0}
.people small{color:var(--ink-2);font-size:14px}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--cs);color:var(--ci);font-family:var(--font-display);font-weight:600;font-size:17px;flex:none}
.hint{margin:14px 0 6px;padding:14px;border-radius:var(--r-md);background:var(--sky-soft);color:var(--sky-ink)}
.hint b{display:block;margin-bottom:2px}
.hint p{margin:0;font-size:15px}

/* Toast */
.toast{position:absolute;left:16px;right:16px;bottom:88px;z-index:30;padding:13px 16px;border-radius:14px;background:var(--ink);color:var(--bg);font-size:15px;font-weight:600;box-shadow:var(--shadow);text-align:center}
.app.is-auth .toast{bottom:24px}
.toast.pop{animation:pop .22s ease-out}
@keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}

/* Sign in */
.auth{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:22px;padding-block:32px}
.brand{text-align:center}
.logo{width:76px;height:76px;margin:0 auto 12px;border-radius:26px;display:grid;place-items:center;background:var(--sage-soft);color:var(--sage-ink)}
.logo svg{width:44px;height:44px}
.brand h1{margin:0;font-family:var(--font-display);font-size:40px;font-weight:600;line-height:1.05}
.brand p{margin:4px 0 0;color:var(--ink-2)}
.auth-card{display:flex;flex-direction:column;gap:12px;padding:20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.auth-card h2{margin:0;font-family:var(--font-display);font-size:22px;font-weight:600}
.auth-card .field{margin:0}
.code{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.code input{padding:0;min-height:58px;text-align:center;font-family:var(--font-display);font-size:26px;font-weight:600;border-radius:14px;border:1.5px solid var(--line-strong);background:var(--bg);width:100%;min-width:0}
.code input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--sage-soft)}
.fine{margin:0;font-size:14px;color:var(--ink-2);text-align:center}
.center{align-self:center}

@media (prefers-reduced-motion: reduce){
  .sheet.in,.toast.pop{animation:none}
}

/* ---------- Caretakers ---------- */
const needs = date => { const w = d(date).getDay(); return w >= 1 && w <= 5 && !HOLIDAYS[date]; };

const SUBMIT = {
  'tile-form': f => {
    const k = f.dataset.k, t = TILES.find(x => x.key === k), day = getDay(curDate());
    let v;
    if (t.kind === 'time') v = { time: val('f-time') || DEFAULT_TIME[k], by: ME };
    else if (t.kind === 'meal') {
      const food = val('f-food').trim();
      if (!food) { showErr('f-food', 'Write what he ate, like "banana and yogurt".'); return; }
      const amt = f.querySelector('input[name="amount"]:checked');
      v = { time: val('f-time') || DEFAULT_TIME[k], food, amount: amt ? amt.value : '', by: ME };
    } else {
      const s = val('f-start'), e = val('f-end');
      if (!s || !e) { showErr('f-start', 'Add both times.'); return; }
      v = { start: s, end: e, by: ME };
    }
    day[k] = v; closeSheet(); render(true); toast(`${t.label} saved. Everyone can see it now.`);
  },
  'note-form': f => {
    const text = val('f-text').trim();
    if (!text) { showErr('f-text', 'Add a few words so the others know what happened.'); return; }
    const kind = (f.querySelector('input[name="kind"]:checked') || { value: 'Note' }).value;
    const n = { time: val('f-ntime') || hhmm(NOW), kind, text, by: ME };
    const notes = getDay(curDate()).notes;
    if (f.dataset.i != null) notes[Number(f.dataset.i)] = n; else notes.push(n);
    closeSheet(); render(true); toast('Saved. Everyone can see it now.');
  },
  'shift-form': f => {
    let who = (f.querySelector('input[name="who"]:checked') || {}).value || '';
    const nn = val('f-newname').trim();
    if (nn) { who = nn; if (!PEOPLE[who]) PEOPLE[who] = POOL[Object.keys(PEOPLE).length % POOL.length]; }
    if (!who) { showErr('who-0', 'Pick who is covering this shift.'); return; }
    const date = f.querySelector('input[name="day"]:checked').value;
    const s = val('f-s'), e = val('f-e');
    if (!s || !e || toMin(e) <= toMin(s)) { showErr('f-e', 'The end time needs to be after the start time.'); return; }
    if (f.dataset.i != null) shifts[f.dataset.date].splice(Number(f.dataset.i), 1);
    (shifts[date] = shifts[date] || []).push({ who, s, e });
    sortShifts(date);
    closeSheet(); render(true); toast(f.dataset.i != null ? 'Shift updated' : `Added ${who}, ${DOW[d(date).getDay()]} ${fmtRange(s, e)}`);
  },
  'copy-form': f => {
    const ws = weekStart();
    const target = f.querySelector('input[name="target"]:checked').value;

    let weeks = target === 'next' ? [addDays(ws, 7)] : target === 'next4' ? [1, 2, 3, 4].map(n => addDays(ws, 7 * n)) : [...f.querySelectorAll('input[name="pick"]:checked')].map(x => x.value);
    if (!weeks.length) { showErr('pk-0', 'Pick at least one week.'); return; }
    copyWeek(ws, weeks, mode); closeSheet(); render(true);
    toast(weeks.length === 1 ? `Copied to ${rangeTxt(weeks[0])}` : `Copied to ${weeks.length} weeks`);
  },
  'place-form': f => {
    if (!val('f-place').trim()) { showErr('f-place', 'Paste a link to the place\'s website or booking page.'); return; }
    closeSheet(); toast('Added. Its classes will show up once its schedule has been read.');
  },
  'email-form': f => {
    const em = val('f-email').trim();
    if (!/^\S+@\S+\.\S+$/.test(em)) { showErr('f-email', 'Enter your email, like name@example.com.'); return; }
    state.email = em; go('code');
    setTimeout(() => { const c = document.getElementById('c0'); if (c) c.focus(); }, 50);
  },
  'code-form': f => {
    const code = [...f.querySelectorAll('.code-d')].map(x => x.value).join('');
    if (code.length < 6) { showErr('c0', 'Enter all 6 digits from the email.'); return; }
    go('today'); toast("Signed in. You'll stay signed in on this phone.");
  },
};

$app.addEventListener('input', e => {
  const t = e.target;

$app.addEventListener('keydown', e => {

$app.addEventListener('paste', e => {
  const t = e.target;

function weekHours(days) {

function entriesFor(day) {
  const out = [];
  TILES.forEach(t => { const v = day[t.key]; if (v) out.push({ at: t.kind === 'nap' ? v.start : v.time, t, v }); });
  day.notes.forEach((n, i) => out.push({ at: n.time, n, i }));
  return out.sort((a, b) => toMin(a.at) - toMin(b.at));
}
function entryText(e) {
  if (e.n) return { title: e.n.kind, detail: e.n.text, by: e.n.by, color: KINDS[e.n.kind] || 'sage', act: `data-act="edit-note" data-i="${e.i}"` };
  const { t, v } = e, act = `data-act="tile" data-k="${t.key}"`;

}
const classesFor = (date, all) => CLASSES.filter(c => c.date === date && !(date === TODAY && toMin(c.s) < NOW) && (all || fitsAge(c))).sort((a, b) => toMin(a.s) - toMin(b.s));

/* ---------- Option B: Clean timeline ---------- */
function viewTodayB() {
  const date = curDate(), day = getDay(date), x = d(date);
  const eyebrow = state.dayOffset === 0 ? 'Today' : state.dayOffset === -1 ? 'Yesterday' : DOWL[x.getDay()];
  const strip = [...Array(7)].map((_, i) => {
    const off = i - 6, dt = addDays(TODAY, off), L = log[dt];

  }).join('');
  const ents = entriesFor(day), missing = TILES.filter(t => !day[t.key]);
  const meals = TILES.filter(t => t.kind === 'meal'), mealsDone = meals.filter(t => day[t.key]).length;
  const stats = [['Up at', day.wake ? fmtT(day.wake.time) : '–'], ['Napped', day.nap ? durTxt(toMin(day.nap.end) - toMin(day.nap.start)) : '–'], ['Meals', `${mealsDone} of ${meals.length}`]];
  let now = '';
  if (state.dayOffset === 0) { const r = nowInfo(); now = `<button type="button" class="b-now" data-act="go" data-to="caretakers"><i class="dot" style="background:var(--${r.color})"></i><span><small>With Ezra now</small>${r.text}</span>${ic.chevR}</button>`; }
  return `
  <header class="top gut">
    <div class="top-row"><div><p class="b-eyebrow">${eyebrow}</p><h1 class="title">${DOW[x.getDay()]}, ${MONL[x.getMonth()]} ${x.getDate()}</h1></div>${avatarBtn()}</div>
    <div class="b-week" role="group" aria-label="Last 7 days">${strip}</div>
  </header>
  <div class="content gut b-pad">
    ${now}
    <div class="b-stats">${stats.map(([k, v]) => `<div><small>${k}</small><b>${v}</b></div>`).join('')}</div>
    ${ents.length ? `<ol class="b-timeline">${ents.map(e => { const t = entryText(e); return `<li class="b-ev" style="${tint(t.color)}"><span class="b-time">${fmtT(e.at)}</span><span class="b-node"></span><button type="button" class="b-card" ${t.act}><b>${esc(t.title)}</b>${t.detail ? `<span>${esc(t.detail)}</span>` : ''}<small>${esc(t.by)}</small></button></li>`; }).join('')}</ol>` : `<p class="b-missing">Nothing logged for this day yet.</p>`}
    ${missing.length ? `<p class="b-missing">Not logged yet: ${missing.map(t => `<button type="button" data-act="tile" data-k="${t.key}">${t.label}</button>`).join(', ')}</p>` : ''}
  </div>
  <button type="button" class="b-fab" data-act="quick-add" aria-label="Add something">${ic.plus}</button>`;
}
function openTypeSheet() {
  const day = getDay(curDate());
  openSheet(`${head(state.dayOffset === 0 ? 'Add to today' : 'Add to this day')}
    <div class="b-types">${TILES.map(t => `<button type="button" class="b-type" style="${tint(t.color)}" data-act="pick-type" data-k="${t.key}"><span class="t-ico">${ic[t.icon]}</span><span>${t.label}</span>${day[t.key] ? '<small>Edit</small>' : ''}</button>`).join('')}
      <button type="button" class="b-type" style="${tint('lav')}" data-act="pick-type" data-k="note"><span class="t-ico">${ic.star}</span><span>Something else (health, milestone, diaper…)</span></button></div>`);
}
function viewCalendarB() {
  const c = state.calTab === 'classes';
  return `
  <header class="top gut">
    <div class="top-row"><h1 class="title">Calendar</h1>${avatarBtn()}</div>
    <div class="b-tabs" role="tablist" aria-label="Calendar views">
      <button type="button" role="tab" aria-selected="${c}" data-act="go" data-to="classes">Classes</button>
      <button type="button" role="tab" aria-selected="${!c}" data-act="go" data-to="caretakers">Caretakers</button>
    </div>
  </header>
  <div class="content gut">${c ? classesB() : caretakersB()}</div>`;
}
function classesB() {
  const days = [...Array(7)].map((_, i) => addDays(TODAY, i));
  if (!days.includes(state.cday)) state.cday = TODAY;
  const sel = state.cday, x = d(sel);
  const list = classesFor(sel, state.allAges);
  const hidden = state.allAges ? 0 : classesFor(sel, true).length - list.length;
  const ideas = IDEAS.filter(i => i.date === sel);
  const strip = days.map(dt => { const n = classesFor(dt, false).length; return `<button type="button" data-act="b-cday" data-date="${dt}" aria-pressed="${dt === sel}" aria-label="${DOWL[d(dt).getDay()]}, ${n} classes">${dt === TODAY ? 'Today' : DOW[d(dt).getDay()]}<b>${d(dt).getDate()}</b><span class="cnt">${'<i></i>'.repeat(Math.min(n, 3))}</span></button>`; }).join('');
  const rows = list.map(c => {
    const P = PLACES[c.p], out = !fitsAge(c);
    const extra = out ? ' · <span class="older">Older kids</span>' : c.note ? ` · <span class="${c.note === 'Waitlist' ? 'wait' : 'spots'}">${c.note}</span>` : '';
    return `<li class="b-class"><div class="b-ctime">${fmtT(c.s)}<small>${c.m} min</small></div><div class="c-main"><h4>${esc(c.t)}</h4><p class="c-place"><i class="dot" style="background:var(--${P.color})"></i>${P.name}</p><p class="c-meta">${ageTxt(c.a)}${extra}</p></div><button type="button" class="b-book" data-act="book" data-i="${CLASSES.indexOf(c)}">Book</button></li>`;
  }).join('');
  return `
    <div class="b-strip" role="group" aria-label="Pick a day">${strip}</div>
    <div class="b-dayhead"><h2>${DOWL[x.getDay()]}, ${MONL[x.getMonth()]} ${x.getDate()}</h2>
      <label class="b-switch"><input type="checkbox" id="b-ages" ${state.allAges ? '' : 'checked'}> Ezra's age only</label></div>
    ${HOLIDAYS[sel] && !list.length ? `<p class="b-missing">Most places are closed for ${HOLIDAYS[sel]}.</p>` : ''}
    ${list.length ? `<ul class="b-list">${rows}</ul>` : (!HOLIDAYS[sel] ? `<p class="b-missing">No classes for Ezra on this day.</p>` : '')}
    ${hidden ? `<p class="muted-sm" style="margin:0">${hidden} more for older kids. Turn off "Ezra's age only" to see ${hidden === 1 ? 'it' : 'them'}.</p>` : ''}
    ${ideas.length ? `<section class="section"><h2 class="h2">Also nearby</h2><ul class="b-list">${ideas.map(i => `<li class="b-class"><div class="b-ctime">${i.when.split(' ').slice(1).join(' ')}<small>${i.price}</small></div><div class="c-main"><h4>${i.t}</h4><p class="c-place">${ic.pin}${i.where}</p></div><button type="button" class="b-book" data-act="idea" data-i="${IDEAS.indexOf(i)}">Details</button></li>`).join('')}</ul></section>` : ''}
    <div class="b-foot"><span>From 4 connected places · checked 6:00 am</span><button type="button" class="btn-text" data-act="places">Manage</button></div>`;
}
const G0 = 7 * 60, G1 = 19 * 60 + 30, PX = 0.64;
const gy = m => (Math.min(Math.max(m, G0), G1) - G0) * PX;
const shortT = m => (Math.floor(m / 60) % 12 || 12) + (m % 60 ? ':' + String(m % 60).padStart(2, '0') : '');
function caretakersB() {
  const ws = weekStart(), days = weekDays(ws);
  if (!weekShiftCount(days)) return weekNav() + emptyWeek();
  const lbl = m => { const h = m / 60; return h === 12 ? '12p' : h > 12 ? (h - 12) + 'p' : h + 'a'; };
  const cols = days.map(dt => {
    const blocks = (shifts[dt] || []).map((s, i) => {
      const a = toMin(s.s), b = toMin(s.e), h = gy(b) - gy(a);
      if (h <= 0) return '';
      return `<button type="button" class="b-blk" style="${tint(colorOf(s.who))};top:${gy(a)}px;height:${h}px" data-act="edit-shift" data-date="${dt}" data-i="${i}" aria-label="${esc(s.who)}, ${fmtRange(a, b)}"><span>${esc(s.who)}</span>${h > 34 ? `<small>${shortT(a)}–${shortT(b)}</small>` : ''}</button>`;
    }).join('');
    const gaps = gapsFor(dt).map(g => `<button type="button" class="b-gapblk" style="top:${gy(g[0])}px;height:${gy(g[1]) - gy(g[0])}px" data-act="fill-gap" data-date="${dt}" data-s="${hhmm(g[0])}" data-e="${hhmm(g[1])}" aria-label="Nobody ${fmtRange(g[0], g[1])}. Fill this gap">${ic.alert}</button>`).join('');
    return `<div class="b-col${needs(dt) ? '' : ' off'}">${blocks}${gaps}</div>`;
  }).join('');
  const hol = days.filter(dt => HOLIDAYS[dt]);
  return `${weekNav()}
    <div class="cover-row"><span class="muted-sm">Tap a block to change it</span>${statusChip(weekGapCount(days))}</div>
    <div class="b-grid">
      <div class="b-gh"><span></span>${days.map(dt => `<span class="${dt === TODAY ? 'is-today' : ''}${HOLIDAYS[dt] ? ' hol' : ''}">${DOW[d(dt).getDay()]}<b>${d(dt).getDate()}</b></span>`).join('')}</div>
      <div class="b-gb" style="height:${gy(G1)}px">
        ${[8, 10, 12, 14, 16, 18].map(h => `<div class="b-line" style="top:${gy(h * 60)}px"><span>${lbl(h * 60)}</span></div>`).join('')}
        <div class="b-cols">${cols}</div>
      </div>
    </div>
    <p class="b-note">${hol.map(dt => `${DOW[d(dt).getDay()]} ${d(dt).getDate()} is ${HOLIDAYS[dt]} (day off). `).join('')}Red stripes are hours nobody is covering. Tap one to fill it.</p>
    <div class="actions"><button type="button" class="btn-soft" data-act="copy-week">${ic.copy} Copy week</button><button type="button" class="btn-primary" data-act="add-shift">${ic.plus} Add shift</button></div>
    <section class="section"><h2 class="h2">Hours this week</h2>${hoursChips(days)}</section>`;
}

/* ---------- Option C: Bright & playful ---------- */
const greeting = () => NOW < 720 ? 'Good morning!' : NOW < 1020 ? 'Good afternoon!' : 'Good evening!';
function viewTodayC() {
  const date = curDate(), day = getDay(date), x = d(date);
  const label = state.dayOffset === 0 ? 'Today' : state.dayOffset === -1 ? 'Yesterday' : `${DOW[x.getDay()]}, ${shortDate(date)}`;
  const r = state.dayOffset === 0 ? nowInfo() : null;
  const meals = TILES.filter(t => t.kind === 'meal'), mealsDone = meals.filter(t => day[t.key]).length;
  const feed = entriesFor(day).reverse();
  return `
  <header class="c-hero gut">
    <div class="top-row">
      <div class="c-daynav"><button type="button" class="icon-btn" data-act="day" data-d="-1" aria-label="Previous day">${ic.chevL}</button><span>${label}</span><button type="button" class="icon-btn" data-act="day" data-d="1" aria-label="Next day" ${state.dayOffset >= 0 ? 'disabled' : ''}>${ic.chevR}</button></div>
      ${avatarBtn()}
    </div>
    <h1 class="c-hello">${state.dayOffset === 0 ? greeting() : `Ezra's ${DOWL[x.getDay()]}`}</h1>
    ${r ? `<button type="button" class="c-with" data-act="go" data-to="caretakers"><span class="av" style="${tint(r.color)}">${r.who ? esc(r.who[0]) : '·'}</span><span>${r.plain}</span></button>` : `<p class="c-with">${MONL[x.getMonth()]} ${x.getDate()}</p>`}
  </header>
  <div class="content gut" style="padding-top:18px">
    <div class="c-quick" role="group" aria-label="Quick add">${TILES.map(t => `<button type="button" class="c-qb" style="${tint(t.color)}" data-act="tile" data-k="${t.key}"><span class="c-qb-ico">${ic[t.icon]}${day[t.key] ? `<i class="c-done">${ic.check}</i>` : ''}</span>${t.label}</button>`).join('')}<button type="button" class="c-qb" style="${tint('lav')}" data-act="add-note"><span class="c-qb-ico">${ic.star}</span>Other</button></div>
    <div class="c-stats">
      <div class="c-stat" style="${tint('butter')}"><small>Up since</small><b>${day.wake ? fmtT(day.wake.time) : '–'}</b></div>
      <div class="c-stat" style="${tint('sky')}"><small>Slept</small><b>${day.nap ? durTxt(toMin(day.nap.end) - toMin(day.nap.start)) : '–'}</b></div>
      <div class="c-stat" style="${tint('peach')}"><small>Meals</small><b>${mealsDone} of ${meals.length}</b></div>
    </div>
    <section class="section">
      <div class="section-head"><h2 class="h2">What's happened</h2><span class="muted-sm">Newest first</span></div>
      ${feed.length ? `<ul class="c-feed">${feed.map(e => { const t = entryText(e); return `<li class="c-msg"><span class="av" style="${tint(colorOf(t.by))}">${esc(t.by[0])}</span><button type="button" class="c-bubble" style="${tint(t.color)}" ${t.act}><span class="c-msg-top"><b>${esc(t.title)}</b><span>${fmtT(e.at)}</span></span>${t.detail ? `<p>${esc(t.detail)}</p>` : ''}<small>${esc(t.by)}</small></button></li>`; }).join('')}</ul>` : `<p class="empty-line">Nothing yet. Tap a button above to add the first thing.</p>`}
    </section>
  </div>`;
}
function classesC() {
  const days = [...Array(7)].map((_, i) => addDays(TODAY, i));
  const upcoming = CLASSES.filter(c => days.includes(c.date) && !(c.date === TODAY && toMin(c.s) < NOW) && (state.allAges || fitsAge(c)));
  const cards = Object.entries(PLACES).map(([k, p]) => {
    const mine = upcoming.filter(c => c.p === k).sort((a, b) => a.date.localeCompare(b.date) || toMin(a.s) - toMin(b.s));
    const byTitle = {};
    mine.forEach(c => { (byTitle[c.t] = byTitle[c.t] || []).push(c); });
    const rows = Object.entries(byTitle).map(([title, cs]) => `<div class="c-cls"><div class="c-cls-h"><b>${esc(title)}</b><small>${cs[0].m} min · ${ageTxt(cs[0].a)}</small></div><div class="c-times">${cs.map(c => `<button type="button" class="c-tchip" data-act="book" data-i="${CLASSES.indexOf(c)}">${c.date === TODAY ? 'Today' : DOW[d(c.date).getDay()]} ${fmtT(c.s)}${c.note ? ` <small>${c.note}</small>` : ''}</button>`).join('')}</div></div>`).join('');
    return `<section class="c-pcard" style="${tint(p.color)}"><header><span class="c-pc-ico">${ic.pin}</span><div><h3>${p.name}</h3><small>${p.auto ? 'Updates automatically' : 'Typed in by hand'}</small></div></header>${rows || `<p class="c-empty">No classes for Ezra's age this week.</p>`}</section>`;
  }).join('');
  const hol = days.filter(dt => HOLIDAYS[dt]).map(dt => ` Most places are closed ${DOWL[d(dt).getDay()]} for ${HOLIDAYS[dt]}.`).join('');
  return `
    <div class="cover-row"><span class="age-badge">${ic.check}Right for Ezra: 12–24 months</span><button type="button" class="btn-text" data-act="ages">${state.allAges ? "Only Ezra's age" : 'Show all ages'}</button></div>
    <p class="sub">The next 7 days, grouped by place. Tap a time to book it on the place's website.${hol}</p>
    ${cards}
    <button type="button" class="btn-dashed wide" data-act="places">${ic.plus} Add or manage places</button>
    <section class="section">
      <div class="section-head"><h2 class="h2">Nearby ideas</h2><span class="muted-sm">Not connected</span></div>
      <div class="c-ideas">${IDEAS.map((x, i) => `<button type="button" class="c-idea" style="${tint(['butter', 'sky', 'lav'][i % 3])}" data-act="idea" data-i="${i}"><span class="price">${x.price}</span><b>${x.t}</b><span>${x.where}</span><span>${x.when}</span></button>`).join('')}</div>
    </section>`;
}
function caretakersC() {
  const ws = weekStart(), days = weekDays(ws);
  if (!weekShiftCount(days)) return weekNav() + emptyWeek();
  const gaps = days.flatMap(dt => gapsFor(dt).map(g => ({ dt, g })));
  const gapHtml = gaps.length
    ? gaps.map(({ dt, g }) => `<div class="c-gap">${ic.alert}<div><b>${DOWL[d(dt).getDay()]}, ${shortDate(dt)}</b><span>Nobody ${fmtRange(g[0], g[1])}</span></div><button type="button" class="btn-mini" data-act="fill-gap" data-date="${dt}" data-s="${hhmm(g[0])}" data-e="${hhmm(g[1])}">Fill</button></div>`).join('')
    : `<div class="c-gap ok">${ic.check}<div><b>Every weekday is covered</b><span>${fmtRange(COVER[0], COVER[1])}</span></div></div>`;
  const cards = weekHours(days).map(([who, mins]) => {
    const pills = days.map(dt => {
      const i = (shifts[dt] || []).findIndex(s => s.who === who), w = DOW[d(dt).getDay()].slice(0, 1), n = d(dt).getDate();
      return i >= 0
        ? `<button type="button" class="c-dp on" data-act="edit-shift" data-date="${dt}" data-i="${i}" aria-label="${esc(who)} on ${DOWL[d(dt).getDay()]}">${w}<b>${n}</b></button>`
        : `<button type="button" class="c-dp${HOLIDAYS[dt] ? ' hol' : ''}" data-act="c-day" data-date="${dt}" data-who="${esc(who)}" aria-label="Add ${esc(who)} on ${DOWL[d(dt).getDay()]}">${w}<b>${n}</b></button>`;
    }).join('');
    const groups = {};
    days.forEach(dt => (shifts[dt] || []).filter(s => s.who === who).forEach(s => { const k = s.s + '-' + s.e; (groups[k] = groups[k] || []).push(DOW[d(dt).getDay()]); }));
    const count = Object.values(groups).reduce((a, g) => a + g.length, 0);
    const lines = Object.entries(groups).map(([k, ds]) => { const [a, b] = k.split('-'); return `<li><b>${ds.join(', ')}</b> · ${fmtRange(a, b)}</li>`; }).join('');
    return `<section class="c-person" style="${tint(colorOf(who))}"><header><span class="av">${esc(who[0])}</span><div><h3>${esc(who)}</h3><small>${count} ${count === 1 ? 'day' : 'days'} this week</small></div><span class="c-hrs">${hrsTxt(mins)}</span></header><div class="c-days">${pills}</div><ul class="c-pattern">${lines}</ul></section>`;
  }).join('');
  const hol = days.filter(dt => HOLIDAYS[dt]).map(dt => ` ${DOW[d(dt).getDay()]} ${d(dt).getDate()} is ${HOLIDAYS[dt]}.`).join('');
  return `${weekNav()}
    ${gapHtml}
    <div class="actions"><button type="button" class="btn-soft" data-act="copy-week">${ic.copy} Copy week</button><button type="button" class="btn-primary" data-act="add-shift">${ic.plus} Add shift</button></div>
    ${cards}
    <p class="muted-sm" style="margin:0">Tap a colored day to change that shift, or an empty day to add one.${hol}</p>`;
}

const VIEWS = {
  a: { today: viewToday, calendar: () => viewCalendar() },
  b: { today: viewTodayB, calendar: viewCalendarB },
  c: { today: viewTodayC, calendar: () => viewCalendar(classesC, caretakersC) },
};

fromHash();
render();
})();
</script>
